[custom]
; ClashRule v2
; 目标：按节点角色、双向流量额度与故障域分流。
; 不要直接覆盖现有 virgil.ini；请先生成测试订阅并验证。
;
; 节点命名约定（必须在订阅源中保持一致）：
; OSAKA_Premium  = Evoxt 大阪 Premium，低延迟核心节点
; GGC_HK_A       = GGC 香港 A，常规海外流量
; GGC_HK_B       = GGC 香港 B，下载与批处理流量
; TOKYO_Standby  = Evoxt 东京 Standard，GGC 整体异常时的不同故障域备用
; HK_Evoxt       = Evoxt 香港，固定 IP / 特定香港兼容业务
;
; -------------------- 本地自定义规则 --------------------
ruleset=Ⓜ️ Direct,https://raw.githubusercontent.com/virgilshwork/clashrule/main/01_direct.list
ruleset=Ⓜ️ Proxy,https://raw.githubusercontent.com/virgilshwork/clashrule/main/01_proxy.list
ruleset=Ⓜ️ 加密货币,https://raw.githubusercontent.com/virgilshwork/clashrule/main/cryptoAll.list
ruleset=Ⓜ️ 挖矿专区,https://raw.githubusercontent.com/virgilshwork/clashrule/main/cryptoMinerPool.list
ruleset=🔞 成人内容,https://raw.githubusercontent.com/virgilshwork/clashrule/main/AV.list
;
; 关键交互应在大流量规则之前，避免 AI API 被错误送到下载池。
ruleset=🟢 核心交互,https://raw.githubusercontent.com/virgilshwork/clashrule/main/AI.list
;
; 海外软件源、镜像、模型、发布包：明确送往 GGC_B。
ruleset=📦 海外下载,https://raw.githubusercontent.com/virgilshwork/clashrule/main/02_bulk_overseas.list
;
; 高流量视频默认进入 GGC_B，而不是大阪。
ruleset=📹 油管视频,https://raw.githubusercontent.com/virgilshwork/clashrule/main/youtube.list
;
; 地区媒体。MediaHK 中包含 GitHub/Google/Facebook 等混合规则，
; 因此默认落在 GGC 香港池，而不是消耗 HK_Evoxt 的 250GB 双向额度。
ruleset=🌍 香港专用,https://raw.githubusercontent.com/virgilshwork/clashrule/main/MediaHK.list
ruleset=🌍 日本专用,https://raw.githubusercontent.com/virgilshwork/clashrule/main/MediaJPN.list
ruleset=🌍 英国专用,https://raw.githubusercontent.com/virgilshwork/clashrule/main/MediaEN.list
ruleset=🌍 美国专用,https://raw.githubusercontent.com/virgilshwork/clashrule/main/MediaUS.list
ruleset=🌍 台湾专用,https://raw.githubusercontent.com/virgilshwork/clashrule/main/MediaTW.list
ruleset=🌍 亚马逊,https://raw.githubusercontent.com/virgilshwork/clashrule/main/Amazon.list
ruleset=🌍 Google Play,https://raw.githubusercontent.com/virgilshwork/clashrule/main/googleplay.list
;
; -------------------- ACL4SSR 基础规则 --------------------
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
ruleset=🛑 广告拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list
ruleset=🍃 应用净化,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanProgramAD.list
ruleset=📢 谷歌FCM,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/GoogleFCM.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/GoogleCN.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/SteamCN.list
ruleset=Ⓜ️ 微软云盘,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/OneDrive.list
ruleset=Ⓜ️ 微软服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Microsoft.list
ruleset=🍎 苹果服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Apple.list
ruleset=📲 电报消息,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Telegram.list
ruleset=🎮 游戏平台,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Epic.list
ruleset=🎮 游戏平台,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Origin.list
ruleset=🎮 游戏平台,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Sony.list
ruleset=🎮 游戏平台,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Steam.list
ruleset=🎮 游戏平台,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Nintendo.list
ruleset=🎥 奈飞视频,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Netflix.list
ruleset=🌏 国内媒体,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaMedia.list
;
; 保留原 ACL4SSR Download.list 的国内/传统下载直连意图。
; 这条规则在 ProxyGFWlist 前；海外软件源由上方 02_bulk_overseas.list 优先拦截。
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Download.list
;
; 未被地区、应用与下载规则命中的 GFW 流量进入 GGC_A 常规流量池。
ruleset=🟡 普通海外,https://raw.githubusercontent.com/virgilshwork/clashrule/main/ProxyGFWlist.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/UnBan.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaIp.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaCompanyIp.list
ruleset=🎯 全球直连,[]GEOIP,CN
ruleset=🟡 普通海外,[]FINAL
;
; -------------------- 节点角色组 --------------------
; 以下五组使用节点名精确正则。节点名称不匹配时，该组会为空。
custom_proxy_group=🗾 大阪Premium`select`(OSAKA_Premium)
custom_proxy_group=🟨 GGC香港A`select`(GGC_HK_A)
custom_proxy_group=🟧 GGC香港B`select`(GGC_HK_B)
custom_proxy_group=🛟 东京备用`select`(TOKYO_Standby)
custom_proxy_group=🇭🇰 Evoxt香港`select`(HK_Evoxt)
;
; 核心交互：默认大阪。大阪达到双向配额软阈值后，手工改为 GGC_A；
; 两台 GGC 同时路由劣化后，手工改为东京。
custom_proxy_group=🟢 核心交互`select`[]🗾 大阪Premium`[]🟨 GGC香港A`[]🛟 东京备用`[]🟧 GGC香港B
;
; 普通海外：默认 GGC_A。GGC_A 的路由劣化时，手工改 GGC_B；
; 两台 GGC 同时异常时改东京。
custom_proxy_group=🟡 普通海外`select`[]🟨 GGC香港A`[]🟧 GGC香港B`[]🛟 东京备用`[]🗾 大阪Premium
;
; 下载池：默认 GGC_B，刻意不放大阪。
custom_proxy_group=📦 海外下载`select`[]🟧 GGC香港B`[]🛟 东京备用`[]🟨 GGC香港A
;
; 香港 IP：默认 GGC_A，避免无差别消耗 HK_Evoxt 的 250GB 双向额度。
; 若某服务明确绑定 HK_Evoxt 的 IP，再手工切到 HK_Evoxt。
custom_proxy_group=🇭🇰 香港IP`select`[]🟨 GGC香港A`[]🟧 GGC香港B`[]🇭🇰 Evoxt香港
;
; 日本 IP：默认大阪。东京不是低延迟日系主力，只作为手工备选。
custom_proxy_group=🇯🇵 日本IP`select`[]🗾 大阪Premium`[]🛟 东京备用
;
; 美国 IP：未部署美西节点前默认手动选择，不能因为名字叫“美国专用”而误走香港。
custom_proxy_group=🇺🇲 美国IP`select`[]🚀 手动切换
;
; -------------------- 诊断与兼容组 --------------------
; 保留自动测速，但不作为业务默认出口。
custom_proxy_group=🚀 手动切换`select`.*
custom_proxy_group=♻️ 自动选择（诊断）`url-test`.*`http://www.apple.com/library/test/success.html`300,,50
custom_proxy_group=🇭🇰 香港节点（诊断）`url-test`(港|HK|hk|Hong Kong|HongKong|hongkong)`http://www.apple.com/library/test/success.html`120,,50
custom_proxy_group=🇺🇲 美国节点（诊断）`url-test`(美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|United States)`http://www.apple.com/library/test/success.html`240,,150
custom_proxy_group=🇯🇵 日本节点（诊断）`url-test`(日本|川日|东京|大阪|泉日|埼玉|沪日|深日|JP|Japan|TOKYO|OSAKA)`http://www.apple.com/library/test/success.html`120,,70
;
; -------------------- 应用/地区业务组 --------------------
custom_proxy_group=Ⓜ️ Direct`select`[]DIRECT`[]PASS`[]REJECT
custom_proxy_group=Ⓜ️ Proxy`select`[]🟡 普通海外`[]🟢 核心交互`[]🚀 手动切换
custom_proxy_group=🔞 成人内容`select`[]🟡 普通海外`[]🗾 大阪Premium`[]🚀 手动切换
custom_proxy_group=Ⓜ️ 加密货币`select`[]🟢 核心交互`[]🇺🇲 美国IP`[]🚀 手动切换
custom_proxy_group=Ⓜ️ 挖矿专区`select`[]🟡 普通海外`[]🇺🇲 美国IP`[]🚀 手动切换
custom_proxy_group=📹 油管视频`select`[]📦 海外下载`[]🟡 普通海外`[]🚀 手动切换
custom_proxy_group=🌍 香港专用`select`[]🇭🇰 香港IP`[]🚀 手动切换
custom_proxy_group=🌍 日本专用`select`[]🇯🇵 日本IP`[]🚀 手动切换
custom_proxy_group=🌍 英国专用`select`[]🚀 手动切换`[]🟡 普通海外
custom_proxy_group=🌍 美国专用`select`[]🇺🇲 美国IP`[]🚀 手动切换
custom_proxy_group=🌍 台湾专用`select`[]🟡 普通海外`[]🚀 手动切换
custom_proxy_group=🌍 亚马逊`select`[]🟡 普通海外`[]DIRECT`[]🚀 手动切换
custom_proxy_group=🌍 Google Play`select`[]🟡 普通海外`[]DIRECT`[]🇭🇰 香港IP`[]🇯🇵 日本IP`[]🚀 手动切换
custom_proxy_group=📲 电报消息`select`[]🟡 普通海外`[]🟢 核心交互`[]🚀 手动切换
custom_proxy_group=🎥 奈飞视频`select`[]🎥 奈飞节点`[]📦 海外下载`[]🟡 普通海外`[]🚀 手动切换
custom_proxy_group=🎥 奈飞节点`select`(NF|奈飞|解锁|Netflix|NETFLIX|Media)
custom_proxy_group=📢 谷歌FCM`select`[]DIRECT`[]🟡 普通海外`[]🚀 手动切换
custom_proxy_group=Ⓜ️ 微软云盘`select`[]DIRECT`[]📦 海外下载`[]🟡 普通海外`[]🚀 手动切换
custom_proxy_group=Ⓜ️ 微软服务`select`[]DIRECT`[]🟡 普通海外`[]🚀 手动切换
custom_proxy_group=🍎 苹果服务`select`[]DIRECT`[]🟡 普通海外`[]🚀 手动切换
custom_proxy_group=🎮 游戏平台`select`[]DIRECT`[]🟢 核心交互`[]🟡 普通海外`[]🚀 手动切换
custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]🟡 普通海外`[]🚀 手动切换
custom_proxy_group=🌏 国内媒体`select`[]REJECT`[]DIRECT`[]PASS
custom_proxy_group=🛑 广告拦截`select`[]REJECT`[]DIRECT`[]PASS
custom_proxy_group=🍃 应用净化`select`[]REJECT`[]DIRECT`[]PASS
;
; -------------------- SubConverter 开关 --------------------
enable_rule_generator=true
overwrite_original_rules=true
;
; 不设置 clash_rule_base，沿用你当前的 SubConverter/ACL4SSR 基础配置行为。
