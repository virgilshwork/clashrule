name: Audit ACL4SSR and Build Draft Rules
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/audit_acl4ssr.py'
      - 'scripts/build_business_rules.py'
      - 'policy/business-draft.json'
      - 'policy/business-layout.json'
      - '.github/workflows/audit-acl4ssr.yml'
  workflow_run:
    workflows: ['Sync ACL4SSR Repository']
    types: [completed]
permissions:
  contents: read
concurrency:
  group: acl4ssr-draft-audit
  cancel-in-progress: false
jobs:
  audit:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser
        run: python -m pip install 'PyYAML==6.0.2'
      - name: Record input revision
        run: git rev-parse HEAD
      - name: Generate business-oriented candidate rules
        run: python scripts/build_business_rules.py --seed policy/business-draft.json --layout policy/business-layout.json --output business-output
      - name: Publish report to run summary
        if: always()
        run: |
          if test -f business-output/REPORT.md; then
            cat business-output/REPORT.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo '解析或业务分类未完成，请查看日志；没有生成成功的候选。' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload audit and business rule candidates
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: acl4ssr-business-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: business-output/
          retention-days: 30
          if-no-files-found: error
