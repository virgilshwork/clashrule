name: Audit ACL4SSR and Build Draft Rules
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/audit_acl4ssr.py'
      - 'scripts/build_business_rules.py'
      - 'scripts/generate_candidate_ini.py'
      - 'scripts/publish_candidate_references.py'
      - 'policy/business-draft.json'
      - 'policy/business-layout.json'
      - '.github/workflows/audit-acl4ssr.yml'
  workflow_run:
    workflows: ['Sync ACL4SSR Repository']
    types: [completed]
permissions:
  contents: write
concurrency:
  group: acl4ssr-draft-audit
  cancel-in-progress: false
jobs:
  audit:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser
        run: python -m pip install 'PyYAML==6.0.2'
      - name: Record input revision
        run: git rev-parse HEAD
      - name: Generate business-oriented candidate rules
        run: python scripts/build_business_rules.py --seed policy/business-draft.json --layout policy/business-layout.json --output business-output
      - name: Generate reference INI and versioned candidate rules
        id: export
        run: python scripts/publish_candidate_references.py --input business-output --publish-root candidates --v3-path virgil-v3.ini
      - name: Verify converted candidate (conversion + kernel load) before publishing
        # NOTE: this workflow only runs on the default branch (checkout ref: main, no pull_request
        # trigger), so the gate protects main-to-main publications. Branch code must be verified
        # separately before merge.
        run: |
          set -euo pipefail
          python -m pip install 'PyYAML==6.0.2'
          bash scripts/run_conversion_acceptance.sh --candidates-dir candidates --work "$RUNNER_TEMP/acceptance"
      - name: Publish candidates only to main
        id: publish
        run: |
          set -euo pipefail
          git add --all -- candidates/ virgil-v3.ini
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Candidate publication unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: publish reference-only candidate INI and rules'
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Publish report to run summary
        if: always()
        env:
          EXPORT_RESULT: ${{ steps.export.outcome }}
          PUBLISH_RESULT: ${{ steps.publish.outcome }}
          PUBLISHED_SHA: ${{ steps.publish.outputs.sha }}
        run: |
          if test -f business-output/REPORT.md; then
            cat business-output/REPORT.md >> "$GITHUB_STEP_SUMMARY"
          fi
          printf '\n引用生成状态：%s；仓库发布状态：%s\n' "$EXPORT_RESULT" "$PUBLISH_RESULT" >> "$GITHUB_STEP_SUMMARY"
          if test "$PUBLISH_RESULT" != 'success'; then
            echo '未确认候选规则 URL 已发布；请查看错误，不要将本轮当作成功发布。' >> "$GITHUB_STEP_SUMMARY"
          elif test -n "$PUBLISHED_SHA"; then
            printf '\n候选发布提交：%s\n' "$PUBLISHED_SHA" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '候选内容无变化，未创建空提交。' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload audit and reference INI
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: acl4ssr-reference-ini-${{ github.run_id }}-${{ github.run_attempt }}
          path: business-output/
          retention-days: 30
          if-no-files-found: error

      # Notify step v2: guards (token shape, chat id shape), curl -f --retry 2, set +e.
      # Manual end-to-end check of the notification path: touch this workflow file and push to main.
      - name: Notify Telegram
        # Success/failure summary. Repo secrets in use: TX7891_BOT (bot token), TX7891_CHAT (chat id).
        # Legacy aliases accepted: TELEGRAM_BOT_TOKEN / BOT_TOKEN / TELEGRAM_TOKEN and TELEGRAM_CHAT_ID / CHAT_ID / TG_CHAT_ID.
        # Missing secrets degrade to a log line instead of failing the job.
        if: always()
        continue-on-error: true
        env:
          # Accept both naming conventions so a differently-named repo secret still works.
          # Accept secrets or repository variables, and a few common naming variants.
          BOT_TOKEN: ${{ secrets.TX7891_BOT || secrets.TELEGRAM_BOT_TOKEN || secrets.BOT_TOKEN || secrets.TELEGRAM_TOKEN || vars.TX7891_BOT || vars.TELEGRAM_BOT_TOKEN || vars.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TX7891_CHAT || secrets.TX7891_CHAT_ID || secrets.TELEGRAM_CHAT_ID || secrets.CHAT_ID || secrets.TG_CHAT_ID || vars.TX7891_CHAT || vars.TELEGRAM_CHAT_ID || vars.CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          CHANGED: ${{ steps.publish.outputs.changed }}
        run: |
          # The runner invokes this with `bash -e`; disable it so a failing diagnostic
          # command cannot kill the step before the notification is attempted.
          set +e
          set -uo pipefail
          if [ -z "${BOT_TOKEN:-}" ] || [ -z "${CHAT_ID:-}" ]; then
            echo "no token/chat id visible: checked secrets+variables TELEGRAM_BOT_TOKEN/BOT_TOKEN/TELEGRAM_TOKEN and TELEGRAM_CHAT_ID/CHAT_ID/TG_CHAT_ID (repository scope)"
            exit 0
          fi
          # Guard: a bot token is <digits>:<secret> (~46 chars). A bare number here means the
          # two secrets were swapped and Telegram would answer 404.
          case "$BOT_TOKEN" in
            *:*) ;;
            *) echo "bot token secret looks wrong: len=${#BOT_TOKEN} (no colon). Expected <digits>:<secret>, about 46 chars."; exit 0 ;;
          esac
          # Guard: the chat id is a short numeric id; a token-shaped value here means the
          # wrong secret was pasted and Telegram would answer 403.
          if ! printf '%s' "$CHAT_ID" | grep -qE '^-?[0-9]{5,15}$'; then
            echo "chat id secret looks wrong: len=${#CHAT_ID} digits=$(printf '%s' "$CHAT_ID" | tr -cd '0-9' | wc -c). Expected a numeric chat id (e.g. 10 digits), not a bot token."
            exit 0
          fi
          PUB=$(python3 -c 'import json;print(json.load(open("candidates/manifest.json"))["publication_id"][:16])' 2>/dev/null || echo n/a)
          RULES=$(python3 -c 'import json;m=json.load(open("candidates/manifest.json"));print(sum(f["rules"] for f in m["ordered_fragments"]))' 2>/dev/null || echo '?')
          GROUPS=$(awk '/^custom_proxy_group=/{n++} END{print n+0}' virgil-v3.ini 2>/dev/null || echo '?')
          FRAGS=$(python3 -c 'import json;print(len(json.load(open("candidates/manifest.json"))["ordered_fragments"]))' 2>/dev/null || echo '?')
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ "$JOB_STATUS" = "success" ]; then
            ICON="✅"; TITLE="clashrule 发布成功"
            printf -v DETAIL "publication_id: %s\n规则数（片段合计）: %s  有序片段: %s  策略组: %s\n本次是否变更: %s" "$PUB" "$RULES" "$FRAGS" "$GROUPS" "${CHANGED:-n/a}"
          else
            ICON="❌"; TITLE="clashrule 发布失败（门禁或构建未通过）"
            printf -v DETAIL "门禁未通过时不发布，线上继续使用旧快照（main: %s）\n请查看运行日志定位失败步骤" "$PUB"
          fi
          TEXT=$(printf "%s %s\n%s\n%s" "$ICON" "$TITLE" "$DETAIL" "$RUN_URL")
          # Diagnostics: lengths only; a full "KEY=value" paste shows up as an unexpected length.
          echo "diag: token_len=${#BOT_TOKEN} chat_len=${#CHAT_ID} chat_digits=$(printf '%s' "$CHAT_ID" | tr -cd '0-9' | wc -c)"
          RESP_FILE=$(mktemp)
          if curl -sS -f --retry 2 --max-time 20 -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${TEXT}" \
            -d disable_web_page_preview=true > "$RESP_FILE"; then
            echo "telegram notification sent"
          else
            echo "telegram notification FAILED"
            # Telegram error bodies carry a description, never the token.
            head -c 400 "$RESP_FILE" | sed 's/[0-9]\{6,\}/<digits>/g'
            exit 1
          fi
