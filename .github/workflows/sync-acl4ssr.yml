name: Sync ACL4SSR Repository
on:
  schedule:
    # Daily 06:00 Beijing time = 22:00 UTC on the previous day.
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 'master or full upstream commit SHA'
        required: true
        default: 'master'
        type: string
permissions:
  contents: write
concurrency:
  group: acl4ssr-sync-main
  cancel-in-progress: false
jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Record baseline
        id: baseline
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Fetch and verify complete upstream tree
        id: fetch
        env:
          UPSTREAM_REF: ${{ inputs.upstream_ref || 'master' }}
        run: python3 scripts/sync_acl4ssr.py --ref "$UPSTREAM_REF"
      - name: Commit source snapshot only
        id: publish
        run: |
          set -euo pipefail
          git add --all -- sources/acl4ssr/
          if git diff --cached --quiet; then
            echo 'No snapshot changes.'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: sync full ACL4SSR source snapshot'
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Chinese full repository summary
        if: always()
        env:
          BASE_SHA: ${{ steps.baseline.outputs.sha }}
          FETCH_RESULT: ${{ steps.fetch.outcome }}
          PUBLISH_RESULT: ${{ steps.publish.outcome }}
          SNAPSHOT_CHANGED: ${{ steps.publish.outputs.changed }}
          PUBLISHED_SHA: ${{ steps.publish.outputs.sha }}
          UPSTREAM_REF: ${{ inputs.upstream_ref || 'master' }}
        run: python3 scripts/acl4ssr_summary.py
